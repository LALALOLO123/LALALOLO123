      <stop offset="0%" stop-color="#00875f"/><stop offset="50%" stop-color="#0969da"/><stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
  </defs>
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
