<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Brian Fu - Application Security Engineer">
  <defs>
    <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00875f"/>
      <stop offset="50%" stop-color="#0969da"/>
      <stop offset="100%" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="glowL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00875f" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00875f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridL" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#e6eaf0" stroke-width="1"/>
    </pattern>
    <clipPath id="l1"><rect x="46" y="96" width="0" height="24"><animate attributeName="width" values="0;150;150;150;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.09;0.9;0.97;1"/></rect></clipPath>
    <clipPath id="l2"><rect x="46" y="132" width="0" height="24"><animate attributeName="width" values="0;0;470;470;470;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.13;0.30;0.9;0.97;1"/></rect></clipPath>
    <clipPath id="l3"><rect x="46" y="180" width="0" height="24"><animate attributeName="width" values="0;0;190;190;190;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.36;0.46;0.9;0.97;1"/></rect></clipPath>
    <clipPath id="l4"><rect x="46" y="216" width="0" height="24"><animate attributeName="width" values="0;0;560;560;560;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.50;0.72;0.9;0.97;1"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .prompt { fill: #00875f; font-size: 17px; font-weight: 700; }
    .cmd    { fill: #1f2328; font-size: 17px; }
    .out    { fill: #656d76; font-size: 16px; }
    .name   { fill: #1f2328; font-size: 46px; font-weight: 700; letter-spacing: 2px; }
    .tag    { fill: #656d76; font-size: 13px; letter-spacing: 5px; }
    .accent { fill: #0969da; }
    .cursor { fill: #00875f; animation: blinkL 1.06s steps(1) infinite; }
    @keyframes blinkL { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
    .scanL { animation: sweepL 9s linear infinite; }
    @keyframes sweepL { 0% { transform: translateY(-40px) } 100% { transform: translateY(300px) } }
  </style>

  <rect width="900" height="300" rx="14" fill="#ffffff"/>
  <rect width="900" height="300" rx="14" fill="url(#gridL)"/>
  <rect width="900" height="300" rx="14" fill="url(#glowL)"/>

  <path d="M14 0h872a14 14 0 0 1 14 14v30H0V14A14 14 0 0 1 14 0z" fill="#f0f3f6"/>
  <circle cx="30" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="6" fill="#febc2e"/>
  <circle cx="74" cy="22" r="6" fill="#28c840"/>
  <text class="mono out" x="450" y="27" text-anchor="middle" font-size="13">brian@fu: ~/portfolio</text>
  <line x1="0" y1="44" x2="900" y2="44" stroke="#d8dee4" stroke-width="1"/>

  <text class="mono name" x="46" y="78">BRIAN FU</text>

  <g clip-path="url(#l1)">
    <text class="mono" x="46" y="114"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">whoami</tspan></text>
  </g>
  <g clip-path="url(#l2)">
    <text class="mono out" x="46" y="150">↳ software engineer · full-stack · compilers · security</text>
  </g>
  <g clip-path="url(#l3)">
    <text class="mono" x="46" y="198"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">cat focus.txt</tspan></text>
  </g>
  <g clip-path="url(#l4)">
    <text class="mono out" x="46" y="234">↳ RLS &amp; authz design · exploit regression · data integrity</text>
  </g>
  <rect class="cursor" x="46" y="252" width="11" height="20"/>

  <text class="mono tag" x="854" y="90" text-anchor="end">TEXAS A&amp;M · CS · DEC 2027</text>
  <text class="mono tag accent" x="854" y="112" text-anchor="end">AUSTIN, TX</text>
  <g opacity="0.9">
    <rect x="770" y="140" width="84" height="3" rx="1.5" fill="#00875f"/>
    <rect x="796" y="152" width="58" height="3" rx="1.5" fill="#0969da"/>
    <rect x="812" y="164" width="42" height="3" rx="1.5" fill="#8250df"/>
  </g>

  <rect class="scanL" x="0" y="0" width="900" height="2" fill="#00875f" opacity="0.06"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="url(#edgeL)" stroke-width="1.5" opacity="0.85"/>
</svg>
