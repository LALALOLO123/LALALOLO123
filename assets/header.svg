<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Brian Fu - Application Security Engineer">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff9f"/>
      <stop offset="50%" stop-color="#00b8ff"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff9f" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00ff9f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1c2733" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect x="46" y="96" width="0" height="24"><animate attributeName="width" values="0;150;150;150;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.09;0.9;0.97;1"/></rect></clipPath>
    <clipPath id="c2"><rect x="46" y="132" width="0" height="24"><animate attributeName="width" values="0;0;470;470;470;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.13;0.30;0.9;0.97;1"/></rect></clipPath>
    <clipPath id="c3"><rect x="46" y="180" width="0" height="24"><animate attributeName="width" values="0;0;190;190;190;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.36;0.46;0.9;0.97;1"/></rect></clipPath>
    <clipPath id="c4"><rect x="46" y="216" width="0" height="24"><animate attributeName="width" values="0;0;560;560;560;0" dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.50;0.72;0.9;0.97;1"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .prompt { fill: #00ff9f; font-size: 17px; font-weight: 700; }
    .cmd    { fill: #e6edf3; font-size: 17px; }
    .out    { fill: #7d8590; font-size: 16px; }
    .accent { fill: #00b8ff; }
    .vio    { fill: #bd00ff; }
    .name   { fill: #e6edf3; font-size: 46px; font-weight: 700; letter-spacing: 2px; }
    .tag    { fill: #7d8590; font-size: 13px; letter-spacing: 5px; }
    .cursor { fill: #00ff9f; animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1 } 51%,100% { opacity: 0 } }
    .scan { animation: sweep 9s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-40px) } 100% { transform: translateY(300px) } }
  </style>

  <rect width="900" height="300" rx="14" fill="#0b0f14"/>
  <rect width="900" height="300" rx="14" fill="url(#grid)"/>
  <rect width="900" height="300" rx="14" fill="url(#glow)"/>

  <!-- title bar -->
  <path d="M14 0h872a14 14 0 0 1 14 14v30H0V14A14 14 0 0 1 14 0z" fill="#11161d"/>
  <circle cx="30" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="6" fill="#febc2e"/>
  <circle cx="74" cy="22" r="6" fill="#28c840"/>
  <text class="mono out" x="450" y="27" text-anchor="middle" font-size="13">brian@fu: ~/portfolio</text>
  <line x1="0" y1="44" x2="900" y2="44" stroke="#1f2630" stroke-width="1"/>

  <!-- name block -->
  <text class="mono name" x="46" y="78">BRIAN FU</text>

  <!-- terminal lines -->
  <g clip-path="url(#c1)">
    <text class="mono" x="46" y="114"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">whoami</tspan></text>
  </g>
  <g clip-path="url(#c2)">
    <text class="mono out" x="46" y="150">↳ software engineer · full-stack · compilers · security</text>
  </g>
  <g clip-path="url(#c3)">
    <text class="mono" x="46" y="198"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">cat focus.txt</tspan></text>
  </g>
  <g clip-path="url(#c4)">
    <text class="mono out" x="46" y="234">↳ RLS &amp; authz design · exploit regression · data integrity</text>
  </g>
  <rect class="cursor" x="46" y="252" width="11" height="20"/>

  <!-- right rail -->
  <text class="mono tag" x="854" y="90" text-anchor="end">TEXAS A&amp;M · CS · DEC 2027</text>
  <text class="mono tag accent" x="854" y="112" text-anchor="end">AUSTIN, TX</text>
  <g opacity="0.85">
    <rect x="770" y="140" width="84" height="3" rx="1.5" fill="#00ff9f"/>
    <rect x="796" y="152" width="58" height="3" rx="1.5" fill="#00b8ff"/>
    <rect x="812" y="164" width="42" height="3" rx="1.5" fill="#bd00ff"/>
  </g>

  <!-- scanline -->
  <rect class="scan" x="0" y="0" width="900" height="2" fill="#00ff9f" opacity="0.07"/>

  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5" opacity="0.9"/>
</svg>
